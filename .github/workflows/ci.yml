name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_env.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T api alembic current
      - name: Verify independent Qdrant service
        run: docker compose exec -T api python -c "from app.config import settings; from qdrant_client import QdrantClient; assert settings.qdrant_url; print('Qdrant collections:', len(QdrantClient(url=settings.qdrant_url).get_collections().collections))"
      - run: python3 scripts/smoke_compose.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down disposable deployment
        if: always()
        run: docker compose down -v
